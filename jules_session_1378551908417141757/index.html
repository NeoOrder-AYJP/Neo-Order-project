<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neokirk — O Resenha de Gestão de Restaurante 67</title>

  <!-- Fontes do Google & Símbolos do Material -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- CSS puro, sem firula de framework — tche tcheee -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Seção do Cabeçalho -->
  <header>
    <div class="header-container">
      <!-- Logo & Marca Neokirk -->
      <div id="brand-logo" class="brand-logo">
        <div class="brand-icon">N</div>
        <div>
          <div class="brand-title">Neokirk</div>
          <div class="brand-subtitle">Resenha & Operações — tche tcheee</div>
        </div>
      </div>

      <!-- Links de Navegação -->
      <nav id="nav-links" class="nav-links">
        <button data-path="landing" class="nav-btn active">Início / Cardápio da Resenha</button>
        <button data-path="client" class="nav-btn">Área do Cliente (Mesa 67)</button>
        <button data-path="staff" class="nav-btn">Painel do Atendente (Bora Bill)</button>
        <button data-path="manager" class="nav-btn">Gestão & Faturamento (La Ele)</button>
      </nav>

      <!-- Informações da Sessão do Usuário -->
      <div id="user-session-info" class="flex items-center gap-3">
        <!-- Preenchido pelo JS -->
      </div>
    </div>
  </header>

  <!-- Área Principal de Conteúdo -->
  <main>
    <div id="view-landing" class="view-section hidden"></div>
    <div id="view-client" class="view-section hidden"></div>
    <div id="view-staff" class="view-section hidden"></div>
    <div id="view-manager" class="view-section hidden"></div>
  </main>

  <!-- Notificação Toast -->
  <div id="toast-message" class="hidden">
    <span class="material-symbols-outlined" style="color: var(--tertiary)">info</span>
    <span id="toast-text">Eitcha! Ação executada com sucesso.</span>
  </div>

  <!-- Scripts Globais da Aplicação -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
