<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor & Gestão — Sistema de Gerenciamento de Restaurante</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-tertiary-container": "#fffbff",
            "tertiary-fixed": "#ffddb8",
            "secondary-container": "#fed7cb",
            "surface-variant": "#e5e2dd",
            "surface-dim": "#dcdad5",
            "surface-container": "#f0ede9",
            "on-secondary-container": "#795c52",
            "error-container": "#ffdad6",
            "on-surface-variant": "#59413a",
            "surface": "#fcf9f4",
            "inverse-primary": "#ffb59f",
            "outline-variant": "#e2bfb5",
            "secondary": "#75584e",
            "surface-container-low": "#f6f3ee",
            "surface-tint": "#af3101",
            "inverse-on-surface": "#f3f0eb",
            "on-secondary-fixed-variant": "#5b4138",
            "error": "#ba1a1a",
            "outline": "#8d7168",
            "surface-container-highest": "#e5e2dd",
            "surface-bright": "#fcf9f4",
            "on-secondary": "#ffffff",
            "tertiary-container": "#a36700",
            "secondary-fixed-dim": "#e4beb3",
            "primary": "#ab2f00",
            "on-error": "#ffffff",
            "on-error-container": "#93000a",
            "on-primary-fixed": "#3a0a00",
            "primary-container": "#ce461a",
            "surface-container-lowest": "#ffffff",
            "on-tertiary-fixed-variant": "#653e00",
            "on-primary-container": "#fffbff",
            "on-background": "#1c1c19",
            "on-tertiary": "#ffffff",
            "on-secondary-fixed": "#2b160f",
            "on-tertiary-fixed": "#2a1700",
            "tertiary-fixed-dim": "#ffb95f",
            "on-primary": "#ffffff",
            "on-primary-fixed-variant": "#862300",
            "background": "#fcf9f4",
            "primary-fixed": "#ffdbd1",
            "secondary-fixed": "#ffdbcf",
            "inverse-surface": "#31302d",
            "on-surface": "#1c1c19",
            "primary-fixed-dim": "#ffb59f",
            "surface-container-high": "#ebe8e3",
            "tertiary": "#825100"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
          spacing: {
            "space-md": "1rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-xl": "2rem",
            "gutter-lg": "1.75rem",
            "gutter-sm": "0.75rem",
            "margin-mobile": "1rem",
            "space-lg": "1.5rem",
            "margin-desktop": "2.5rem",
            gutter: "1.25rem",
            margin: "1.5rem"
          },
          fontFamily: {
            "headline-md": ["Plus Jakarta Sans"],
            "display-lg": ["Plus Jakarta Sans"],
            "headline-sm": ["Plus Jakarta Sans"],
            "body-lg": ["Plus Jakarta Sans"],
            "title-md": ["Plus Jakarta Sans"],
            "body-sm": ["Plus Jakarta Sans"],
            "label-lg": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"],
            "label-md": ["Plus Jakarta Sans"],
            "headline-lg-mobile": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "label-sm": ["Plus Jakarta Sans"]
          },
          fontSize: {
            "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "display-lg": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
            "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
            "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "title-md": ["16px", { lineHeight: "24px", fontWeight: "600" }],
            "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
            "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }],
            "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }],
            "headline-lg-mobile": ["26px", { lineHeight: "34px", letterSpacing: "-0.01em", fontWeight: "700" }],
            "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.015em", fontWeight: "700" }],
            "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "700" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background font-body-md text-on-surface min-h-screen flex flex-col selection:bg-secondary-container selection:text-on-secondary-container">

  <!-- Header Section -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(41,21,14,0.04)]">
    <div class="h-20 w-full px-margin-desktop flex items-center justify-between gap-gutter">
      <!-- Logo & Brand -->
      <div class="flex items-center gap-space-lg">
        <div id="brand-logo" class="flex items-center gap-space-sm cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-primary text-on-primary flex items-center justify-center font-bold text-xl shadow-md">
            S
          </div>
          <div class="flex flex-col">
            <span class="font-title-md text-title-md text-on-surface tracking-tight leading-none">Sabor & Gestão</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant font-normal tracking-wide mt-1">Gastronomia & Operações</span>
          </div>
        </div>

        <!-- Navigation Links -->
        <nav id="nav-links" class="hidden xl:flex items-center gap-space-xs bg-surface-container-low p-1 rounded-xl">
          <button data-path="landing" class="nav-btn px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all">
            Início / Cardápio
          </button>
          <button data-path="client" class="nav-btn px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all">
            Área do Cliente (Mesa)
          </button>
          <button data-path="staff" class="nav-btn px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all">
            Painel do Atendente
          </button>
          <button data-path="manager" class="nav-btn px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all">
            Gestão & Faturamento
          </button>
        </nav>
      </div>

      <!-- Right Header Status & Session -->
      <div class="flex items-center gap-space-md">
        <div class="hidden sm:flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-surface-container-lowest shadow-[0_2px_8px_-2px_rgba(41,21,14,0.05)]">
          <span class="w-2.5 h-2.5 rounded-full bg-[#16A34A] animate-pulse"></span>
          <span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Online (localStorage)</span>
        </div>

        <div class="h-6 w-px bg-surface-variant hidden sm:block"></div>

        <div id="user-session-info" class="flex items-center gap-space-sm">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="w-full pt-20 bg-background flex-1 flex flex-col">
    <!-- View Containers -->
    <div id="view-landing" class="view-section hidden w-full"></div>
    <div id="view-client" class="view-section hidden w-full"></div>
    <div id="view-staff" class="view-section hidden w-full"></div>
    <div id="view-manager" class="view-section hidden w-full"></div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-message" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-space-sm bg-inverse-surface text-inverse-on-surface px-space-md py-space-sm rounded-xl shadow-xl">
    <span class="material-symbols-outlined text-tertiary-fixed" style="font-variation-settings: 'FILL' 1;">check_circle</span>
    <span id="toast-text" class="font-label-md text-label-md">Ação executada com sucesso.</span>
  </div>

  <!-- Global Application Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
