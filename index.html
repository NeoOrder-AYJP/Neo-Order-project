<!DOCTYPE html>

<body class="bg-background font-body-md text-on-surface min-h-screen flex flex-col selection:bg-secondary-container selection:text-on-secondary-container">

  <!-- Fixed Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(41,21,14,0.04)]">
    <div class="h-20 w-full px-margin-mobile md:px-margin-desktop flex items-center justify-between gap-gutter">
      <div class="flex items-center gap-space-lg">
        <a href="#inicio-cardapio" class="flex items-center gap-space-sm cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-primary text-on-primary flex items-center justify-center font-bold text-xl shadow-md">S</div>
          <div class="flex flex-col">
            <span class="font-title-md text-title-md text-on-surface tracking-tight leading-none">Sabor &amp; Gestão</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant font-normal tracking-wide mt-1">Gastronomia &amp; Operações</span>
          </div>
        </a>
        <nav class="hidden xl:flex items-center gap-space-xs bg-surface-container-low p-1 rounded-xl" id="main-nav">
          <a class="px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all" data-route="inicio-cardapio" href="#inicio-cardapio">Início / Cardápio</a>
          <a class="px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all" data-route="mesa-cliente" href="#mesa-cliente">Área do Cliente</a>
          <a class="px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all" data-route="painel-atendente" href="#painel-atendente">Painel do Atendente</a>
          <a class="px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all" data-route="gestao-faturamento" href="#gestao-faturamento">Gestão &amp; Faturamento</a>
        </nav>
      </div>

      <div class="flex items-center gap-space-md" id="header-right-actions">
        <!-- Status indicator & Session Info -->
        <div class="hidden sm:flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-surface-container-lowest shadow-[0_2px_8px_-2px_rgba(41,21,14,0.05)]">
          <span class="w-2 h-2 rounded-full bg-[#16A34A] animate-pulse"></span>
          <span class="font-label-sm text-label-sm text-on-surface-variant font-medium" id="sync-status">Sincronizado (Supabase + Local)</span>
        </div>
        <div id="user-header-info" class="flex items-center gap-space-sm"></div>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="w-full pt-20 bg-background flex-1" id="app-root">
    <!-- Dynamic View Content Loaded Here -->
  </main>

  <!-- Notification Toast -->
  <div class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-space-sm bg-inverse-surface text-inverse-on-surface px-space-md py-space-sm rounded-xl shadow-xl" id="toast-message">
    <span class="material-symbols-outlined text-tertiary-fixed" style="font-variation-settings: 'FILL' 1;">check_circle</span>
    <span class="font-label-md text-label-md" id="toast-text">Ação executada com sucesso.</span>
  </div>

  <!-- Global Modals Container -->
  <div id="modals-container"></div>

  <!-- App Entry Script -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
